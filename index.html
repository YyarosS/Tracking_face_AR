<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindAR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    device-orientation-permission-ui="enabled: false"
    vr-mode-ui="enabled: false"
>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
            src="electric_guitar_explorer.glb"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
            animation-mixer
        ></a-gltf-model>

    </a-entity>
    
    <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.5" position="1 2 1"></a-light>
    <a-light type="point" color="#ffeecc" intensity="0.8" position="-1 1 -1"></a-light>

</a-scene>

</body>
</html>
